<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería - Formulario de Pedidos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="main-header">
        <h1> Cafetería Aroma & Sabor</h1>
        <p class="subtitle">Realiza tu pedido en línea de forma rápida y sencilla</p>
    </header>

    <main class="form-wrapper">
        <div class="device-card">
            <div class="card-header">
                <h2>Formulario de Pedidos</h2>
            </div>

            <!-- El formulario envía por método POST a la ruta /pedido del servidor Node.js -->
            <form action="/pedido" method="POST" id="formPedido">

                <!-- 1. Nombre del cliente (obligatorio) -->
                <div class="field">
                    <label for="cliente" class="label">Nombre del cliente <span class="required">*</span></label>
                    <input type="text" id="cliente" name="cliente" class="input-box" required placeholder="Ingresa tu nombre..." autocomplete="off">
                </div>

                <!-- 2. Correo electrónico -->
                <div class="field">
                    <label for="correo" class="label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="input-box" placeholder="correo@ejemplo.com">
                </div>

                <!-- 3. Selección de producto mediante lista desplegable -->
                <div class="field">
                    <label for="producto" class="label">Seleccionar producto <span class="required">*</span></label>
                    <select id="producto" name="producto" class="input-box" required>
                        <option value="" disabled selected>Selecciona un producto...</option>
                        <option value="Capuchino">Capuchino</option>
                        <option value="Café Americano">Café Americano</option>
                        <option value="Latte">Latte</option>
                        <option value="Moca">Moca</option>
                        <option value="Espresso">Espresso</option>
                        <option value="Té Chai">Té Chai</option>
                    </select>
                </div>

                <!-- 4. Cantidad de productos con un mínimo de 1 -->
                <div class="field">
                    <label for="cantidad" class="label">Cantidad de productos (mínimo 1) <span class="required">*</span></label>
                    <input type="number" id="cantidad" name="cantidad" class="input-box" min="1" value="1" required>
                </div>

                <!-- 5. Selección del tamaño de la bebida mediante radio -->
                <div class="field">
                    <span class="label">Tamaño de la bebida</span>
                    <div class="options-group">
                        <label class="option-item">
                            <input type="radio" name="tamano" value="Chico">
                            <span>Chico</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="tamano" value="Mediano" checked>
                            <span>Mediano</span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="tamano" value="Grande">
                            <span>Grande</span>
                        </label>
                    </div>
                </div>

                <!-- 6. Casilla para solicitar el pedido para llevar -->
                <div class="field">
                    <div class="options-group">
                        <label class="option-item">
                            <input type="checkbox" id="llevar" name="llevar" value="Sí">
                            <span>Solicitud para llevar</span>
                        </label>
                    </div>
                </div>

                <!-- 7. Campo de observaciones (textarea) -->
                <div class="field">
                    <label for="observaciones" class="label">Observaciones</label>
                    <textarea id="observaciones" name="observaciones" class="input-box textarea-box" placeholder="Ej. Sin azúcar, leche de almendra, extra caliente..."></textarea>
                </div>

                <!-- 8. Botones para registrar y limpiar -->
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Registrar Pedido</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>

            </form>
        </div>
    </main>

    <footer class="footer">
        <p>Práctica de Programación Web &copy; 2026 - Conexión Cliente y Servidor Node.js</p>
    </footer>

</body>
</html>
